<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Earthling Official — Broomz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #canvas { display: block; width: 100%; height: 100%; }

  /* LOADING SCREEN */
  #loading {
    position: fixed; inset: 0; background: #0a0a12;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; gap: 16px;
  }
  #loading h1 { font-family: monospace; color: #fff; font-size: 20px; letter-spacing: 3px; }
  #loading-bar-wrap { width: 200px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
  #loading-bar { height: 100%; width: 0%; background: #4ade80; border-radius: 2px; transition: width 0.2s; }
  #loading-pct { font-family: monospace; color: rgba(255,255,255,0.4); font-size: 11px; letter-spacing: 2px; }

  /* HUD */
  #hud { position: fixed; top: 12px; left: 16px; pointer-events: none; z-index: 10; }
  #stamina-label { font-family: monospace; font-size: 10px; color: #aaa; letter-spacing: 1px; margin-bottom: 4px; }
  #stamina-bar { width: 130px; height: 5px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; }
  #stamina-fill { height: 100%; width: 100%; background: #4ade80; border-radius: 3px; transition: background 0.3s; }

  /* PC hint */
  #pc-hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-family: monospace; font-size: 10px; color: rgba(255,255,255,0.35);
    letter-spacing: 1px; pointer-events: none; z-index: 10; text-align: center; white-space: nowrap;
  }

  /* Crosshair */
  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 14px; height: 14px; pointer-events: none; z-index: 10; display: none;
  }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.65); }
  #crosshair::before { width: 1px; height: 100%; left: 50%; transform: translateX(-50%); }
  #crosshair::after  { width: 100%; height: 1px; top: 50%; transform: translateY(-50%); }

  /* MOBILE CONTROLS */
  #mobile-controls {
    position: fixed; bottom: 0; left: 0; width: 100%;
    height: 190px; display: none; align-items: center;
    justify-content: space-between; padding: 0 28px 18px; z-index: 20; pointer-events: none;
  }
  .joystick-zone { width: 110px; height: 110px; position: relative; pointer-events: all; }
  .joystick-base {
    width: 110px; height: 110px; border-radius: 50%;
    background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.15);
    position: absolute; top: 0; left: 0;
  }
  .joystick-knob {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.3); border: 1.5px solid rgba(255,255,255,0.45);
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    pointer-events: none;
  }
  #run-toggle {
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(74,222,128,0.12); border: 2px solid rgba(74,222,128,0.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: all; cursor: pointer; user-select: none; gap: 2px;
    transition: background 0.2s, border-color 0.2s;
  }
  #run-toggle.active  { background: rgba(74,222,128,0.3); border-color: #4ade80; }
  #run-toggle.drained { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); }
  #run-icon { font-size: 17px; line-height: 1; }
  #run-label { font-family: monospace; font-size: 8px; color: rgba(255,255,255,0.65); letter-spacing: 0.5px; }

  @media (max-height: 420px) {
    #mobile-controls { height: 140px; padding: 0 20px 10px; }
    .joystick-zone { width: 90px; height: 90px; }
    .joystick-base { width: 90px; height: 90px; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="loading">
  <h1>EARTHLING OFFICIAL</h1>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-pct">LOADING...</div>
</div>

<div id="crosshair"></div>

<div id="hud">
  <div id="stamina-label">STAMINA</div>
  <div id="stamina-bar"><div id="stamina-fill"></div></div>
</div>

<div id="pc-hint">WASD · MOUSE LOOK (CLICK TO LOCK) · SHIFT RUN · ESC UNLOCK</div>

<div id="mobile-controls">
  <div class="joystick-zone" id="left-zone">
    <div class="joystick-base"></div>
    <div class="joystick-knob" id="left-knob"></div>
  </div>
  <div id="run-toggle">
    <div id="run-icon">⚡</div>
    <span id="run-label">RUN</span>
  </div>
  <div class="joystick-zone" id="right-zone">
    <div class="joystick-base"></div>
    <div class="joystick-knob" id="right-knob"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

// ── RENDERER ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputEncoding = THREE.sRGBEncoding;

// ── SCENE ─────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.FogExp2(0x0a0a12, 0.025);

// ── CAMERA ────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.01, 300);
camera.position.set(0, 1.7, 4);

// ── LIGHTS ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x334466, 0.9));
const sun = new THREE.DirectionalLight(0xffeedd, 1.6);
sun.position.set(6, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 0.1, far: 100 });
scene.add(sun);
const fill = new THREE.PointLight(0x4466ff, 0.9, 40);
fill.position.set(-6, 3, -6);
scene.add(fill);
const rim = new THREE.PointLight(0xff6644, 0.6, 25);
rim.position.set(6, 2, -10);
scene.add(rim);

// ── FLOOR ─────────────────────────────────────────────────────────────────
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9, metalness: 0.1 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
scene.add(new THREE.GridHelper(200, 80, 0x222244, 0x181828));

// ── LOAD MODEL ────────────────────────────────────────────────────────────
const loadingEl  = document.getElementById('loading');
const loadingBar = document.getElementById('loading-bar');
const loadingPct = document.getElementById('loading-pct');
let model = null;

// NOTE: switched from raw.githubusercontent.com -> cdn.jsdelivr.net (gh mirror).
// The artifact sandbox's CSP only allows a small set of CDN domains for network
// requests, and raw.githubusercontent.com isn't on that list, so the fetch was
// getting silently blocked by the browser regardless of whether the file itself
// was valid. jsdelivr's GitHub mirror serves the identical file and is already
// trusted here (it's what three.js itself is loaded from above).
new GLTFLoader().load(
  'https://cdn.jsdelivr.net/gh/EarthlingOfficial/public-archive@main/broomz.glb',
  gltf => {
    model = gltf.scene;
    model.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });

    // Rest the model's own lowest point on the world floor (y=0) — its
    // native coordinates may put it anywhere, including underground
    // relative to the floor plane — then spawn the camera at normal eye
    // height above that, at the model's horizontal center.
    const box    = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    console.log('[Broomz] bounding box min:', box.min, 'max:', box.max, 'center:', center);
    model.position.y -= box.min.y;
    scene.add(model);

    player.x = center.x;
    player.z = center.z;
    player.y = 40.20; // confirmed correct standing height on the model's floor
    console.log('[Broomz] camera spawn set to', player.x, player.y, player.z, '— use R/F to nudge height, values print live below.');

    if (gltf.animations.length) {
      window._mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach(clip => window._mixer.clipAction(clip).play());
    }

    loadingEl.style.display = 'none';
    if (isMobile()) {
      document.getElementById('mobile-controls').style.display = 'flex';
      document.getElementById('pc-hint').style.display = 'none';
    }
  },
  xhr => {
    if (xhr.total) {
      const pct = Math.round(xhr.loaded / xhr.total * 100);
      loadingBar.style.width = pct + '%';
      loadingPct.textContent = pct + '%';
    }
  },
  err => {
    loadingPct.textContent = 'FAILED TO LOAD MODEL';
    console.error(err);
  }
);

// ── PLAYER ────────────────────────────────────────────────────────────────
const player = {
  yaw: 0, pitch: 0, x: 0, y: 1.7, z: 4,
  stamina: 1, running: false, runToggled: false, drained: false,
  WALK: 0.06, RUN: 0.14, DRAIN: 0.008, REGEN: 0.004
};

// ── KEYBOARD ──────────────────────────────────────────────────────────────
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') player.running = true;
  if (e.code === 'KeyR') { player.y += 0.5; console.log('[Broomz] player.y =', player.y.toFixed(2)); }
  if (e.code === 'KeyF') { player.y -= 0.5; console.log('[Broomz] player.y =', player.y.toFixed(2)); }
});
addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') player.running = false;
});

// ── POINTER LOCK ──────────────────────────────────────────────────────────
let locked = false;
canvas.addEventListener('click', () => { if (!isMobile()) canvas.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  document.getElementById('crosshair').style.display = locked ? 'block' : 'none';
});
document.addEventListener('mousemove', e => {
  if (!locked) return;
  player.yaw   -= e.movementX * 0.002;
  player.pitch  = Math.max(-1.4, Math.min(1.4, player.pitch - e.movementY * 0.002));
});
addEventListener('keydown', e => { if (e.code === 'Escape' && locked) document.exitPointerLock(); });

// ── MOBILE DETECTION ──────────────────────────────────────────────────────
function isMobile() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || matchMedia('(pointer:coarse)').matches;
}

// ── JOYSTICKS ─────────────────────────────────────────────────────────────
const mobileMove = { x: 0, y: 0 };
const mobileLook = { x: 0, y: 0 };

function joystick(zoneId, knobId, out) {
  const zone = document.getElementById(zoneId);
  const knob = document.getElementById(knobId);
  const R = 33;
  let id = null, ox = 0, oy = 0;
  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    if (id !== null) return;
    const t = e.changedTouches[0]; id = t.identifier;
    const r = zone.getBoundingClientRect();
    ox = r.left + r.width / 2; oy = r.top + r.height / 2;
  }, { passive: false });
  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier !== id) continue;
      let dx = t.clientX - ox, dy = t.clientY - oy;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d > R) { dx *= R/d; dy *= R/d; }
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      out.x = dx / R; out.y = dy / R;
    }
  }, { passive: false });
  const end = e => {
    for (const t of e.changedTouches) {
      if (t.identifier !== id) continue;
      id = null; knob.style.transform = 'translate(-50%,-50%)'; out.x = 0; out.y = 0;
    }
  };
  zone.addEventListener('touchend', end, { passive: false });
  zone.addEventListener('touchcancel', end, { passive: false });
}
joystick('left-zone', 'left-knob', mobileMove);
joystick('right-zone', 'right-knob', mobileLook);

// Run toggle
const runToggle = document.getElementById('run-toggle');
const runLabel  = document.getElementById('run-label');
runToggle.addEventListener('touchstart', e => {
  e.preventDefault();
  if (player.drained) return;
  player.runToggled = !player.runToggled;
  runToggle.classList.toggle('active', player.runToggled);
}, { passive: false });

// ── FOOTSTEPS ─────────────────────────────────────────────────────────────
const actx = new (AudioContext || webkitAudioContext)();
let stepT = 0;
function footstep(run) {
  if (actx.state === 'suspended') actx.resume();
  const buf = actx.createBuffer(1, actx.sampleRate * 0.12, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    const t = i / actx.sampleRate;
    d[i] = (Math.random()*2-1) * Math.exp(-t*(run?35:25)) * (run?.6:.4)
           + Math.sin(2*Math.PI*(run?90:70)*t) * Math.exp(-t*40) * .5;
  }
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type='lowshelf'; f.frequency.value=200; f.gain.value=run?8:4;
  const g = actx.createGain(); g.gain.value = run?.5:.35;
  src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
}

// ── STAMINA ───────────────────────────────────────────────────────────────
const staminaFill = document.getElementById('stamina-fill');
function updateStamina(running) {
  if (running && !player.drained) {
    player.stamina -= player.DRAIN;
    if (player.stamina <= 0) {
      player.stamina = 0; player.drained = true;
      player.runToggled = false;
      runToggle.classList.remove('active'); runToggle.classList.add('drained');
      runLabel.textContent = 'TIRED';
    }
  } else {
    player.stamina = Math.min(1, player.stamina + player.REGEN);
    if (player.drained && player.stamina >= 1) {
      player.drained = false;
      runToggle.classList.remove('drained'); runLabel.textContent = 'RUN';
    }
  }
  staminaFill.style.width = (player.stamina * 100) + '%';
  staminaFill.style.background = player.drained ? '#ef4444' : player.stamina < 0.3 ? '#facc15' : '#4ade80';
}

// ── RESIZE ────────────────────────────────────────────────────────────────
function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
screen.orientation?.addEventListener('change', () => setTimeout(resize, 100));
resize();

// ── LOOP ──────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let prev = 0;

(function animate() {
  requestAnimationFrame(animate);
  const now = clock.getElapsedTime(), dt = now - prev; prev = now;

  if (window._mixer) window._mixer.update(dt);

  const mob = isMobile();
  const running = !player.drained && (mob ? player.runToggled : player.running);
  updateStamina(running);
  const speed = running ? player.RUN : player.WALK;

  let mx = 0, mz = 0;
  if (mob) {
    mx = mobileMove.x; mz = mobileMove.y;
    player.yaw   -= mobileLook.x * 0.03;
    player.pitch  = Math.max(-1.4, Math.min(1.4, player.pitch - mobileLook.y * 0.03));
  } else {
    if (keys['KeyW'] || keys['ArrowUp'])    mz -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])  mz += 1;
    if (keys['KeyA'] || keys['ArrowLeft'])  mx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  }

  const moving = Math.abs(mx) > 0.05 || Math.abs(mz) > 0.05;
  if (moving) {
    const len = Math.sqrt(mx*mx + mz*mz);
    mx /= len; mz /= len;
    const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    const rgt = new THREE.Vector3( Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    player.x += (fwd.x * -mz + rgt.x * mx) * speed;
    player.z += (fwd.z * -mz + rgt.z * mx) * speed;
    stepT -= dt;
    if (stepT <= 0) { footstep(running); stepT = running ? 0.28 : 0.45; }
  } else { stepT = 0; }

  camera.position.set(player.x, player.y, player.z);
  camera.quaternion.setFromEuler(new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ'));

  renderer.render(scene, camera);
})();
</script>
</body>
</html>
